<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SU New Ad Blocker</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="popup-container">
      <header class="popup-header">
        <h1 class="popup-title">SU New Ad Blocker</h1>
        <span class="version-tag">v0.1.0</span>
      </header>

      <div id="status-container" class="status-message status-restricted" hidden></div>

      <section class="site-status-section">
        <div class="site-info">
          <span class="site-label">Current Site:</span>
          <span id="current-site-display" class="site-hostname">Loading...</span>
        </div>
        <button
          id="pause-site-button"
          class="toggle-btn"
          type="button"
          role="switch"
          aria-checked="false"
        >
          <span class="btn-text">Pause on this site</span>
        </button>
      </section>

      <section class="stats-card">
        <div class="stats-item">
          <span class="stats-number" id="tab-blocked-count">—</span>
          <span class="stats-label">Network matches for this site (debug build)</span>
        </div>
        <div class="stats-divider"></div>
        <div class="stats-item">
          <span class="stats-number" id="today-blocked-count">—</span>
          <span class="stats-label">Network matches today</span>
        </div>
      </section>

      <section class="breakdown-section" id="breakdown-section">
        <span class="breakdown-item">Network: <strong id="count-network">—</strong></span>
        <span class="breakdown-item"
          >Cosmetic elements hidden: <strong id="count-cosmetic">—</strong></span
        >
        <span class="breakdown-item"
          >YouTube ad UI hidden: <strong id="count-youtube">—</strong></span
        >
        <span class="breakdown-item"
          ><span data-i18n="statYoutubeDetected">YouTube ad selector matches</span>:
          <strong id="count-youtube-detected">—</strong></span
        >
        <span class="breakdown-item"
          ><span data-i18n="statYoutubeUnhidden">Detected but not hidden by this extension</span>:
          <strong id="count-youtube-unhidden">—</strong></span
        >
      </section>

      <footer class="popup-footer">
        <button id="open-options-button" class="link-btn" type="button">
          Open Settings & Dashboard
        </button>
      </footer>
    </div>
    <script src="popup.js" type="module"></script>
  </body>
</html>
